name = "medib4-worker"
main = "index.js"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "medib4-db"
database_id = "de8eee45-f9cf-45ef-ab49-a044240b4bc3"

[[kv_namespaces]]
binding = "BACKUPS"
id = "8acc02b18d71473fa940e1ab3de67fbd"

# Runs every Sunday at 03:00 UTC and stores a full JSON backup in the BACKUPS KV namespace
[triggers]
crons = ["0 3 * * 0"]

# Admin password must be set as a secret, NOT here:
#   wrangler secret put ADMIN_PASSWORD
