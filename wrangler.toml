name = "medib4-worker"
main = "index.js"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "medib4-db"
database_id = "48fc81ee-682f-4730-adef-2bfd9cfa6a4a"

[[kv_namespaces]]
binding = "BACKUPS"
id = "6bc3f593f0cc4ed4a281182477cb06d8"

# Runs every Sunday at 03:00 UTC and stores a full JSON backup in the BACKUPS KV namespace
[triggers]
crons = ["0 3 * * SUN"]

# Admin password must be set as a secret, NOT here:
#   wrangler secret put ADMIN_PASSWORD
